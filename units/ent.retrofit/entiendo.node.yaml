apiVersion: entiendo/v1
kind: Node
id: ent.retrofit
name: Retrofit Proposer
task: Infer candidate unit manifests for an unmanaged repo and stage them; never write
  into the real tree.
description: Directory-grouping heuristic with static import edges, confidence and
  notes per proposal, boundary-uncertain flags until a human supplies a fixture. The
  semantic pass lives in the entiendo-retrofit skill; this is the baseline.
nodeKind: compute
group: agents
owner: akashdatageek
status: experimental
claims:
- src/ent/extract/__init__.py
- src/ent/extract/collect_plugin.py
- src/ent/extract/static_ast.py
- src/ent/retrofit.py
contract:
  entrypoint: src/ent/retrofit.py::propose
  invariants:
  - len(output) >= 1
  sideEffects: none
evals:
  tier0:
  - type: invariant_check
  - type: smoke
    fixture: evals/ent.retrofit/smoke.jsonl
observability:
  spanName: ent.retrofit
dependencies:
  calls:
  - ent.contracts
  - ent.evalkit
  - ent.packaging
  writes: []
