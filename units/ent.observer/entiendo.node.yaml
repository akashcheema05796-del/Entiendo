apiVersion: entiendo/v1
kind: Node
id: ent.observer
name: Runtime Observer
task: Bind callables to unit ids with @ent.node() and turn recorded spans into verified edge
  observations.
description: 'The only Entiendo code that lives inside the observed app. Times calls, re-raises
  exceptions unchanged, never alters return values (Invariant 2: read-only observer, never
  in the request path). Span capture feeds the trace lens and flips declared edges to runtime-verified.
  The OTel GenAI reader ingests gen_ai.* spans emitted by standard auto-instrumentation (OpenLLMetry/OpenLIT
  style) — reading, never proxying: token usage and observed model identity arrive without
  Entiendo entering the request path.'
nodeKind: compute
group: runtime
owner: akashdatageek
status: experimental
claims:
- src/ent/instrument.py
- src/ent/tracing.py
- src/ent/spans.py
- src/ent/otel.py
contract:
  invariants:
  - output['result'] == 42
  - output['spans'] == 1
  entrypoint: src/ent/instrument.py::node
  harness: evals/harness/selfhost.py::instrument_node
  sideEffects: writes
evals:
  tier0:
  - type: invariant_check
  - type: smoke
    fixture: evals/ent.observer/smoke.jsonl
observability:
  spanName: ent.observer
dependencies:
  calls:
  - ent.contracts
  - ent.packaging
  writes: []
