# NOTE: entrypoint takes (node, root) — blocked on the single-arg harness seam
apiVersion: entiendo/v1
kind: Node
id: ent.evalkit
name: Tiered Eval Runner
task: Execute tier0/tier1 evals for a unit in an isolated sandbox with stubbed neighbours,
  and produce verdicts.
description: Entrypoint resolution (packaged or standalone modules), fixture execution under
  rlimits, dependency stubbing so tier0 stays free of I/O, metrics, significance verdicts
  (paired bootstrap), invariant checking.
nodeKind: compute
group: quality
owner: akashdatageek
status: experimental
claims:
- src/ent/evals/__init__.py
- src/ent/evals/entrypoint.py
- src/ent/evals/metrics.py
- src/ent/evals/runner.py
- src/ent/invariants.py
- src/ent/sandbox.py
- src/ent/verdicts.py
- src/ent/testing.py
contract:
  invariants: []
  sideEffects: none
evals:
  tier0:
  - type: invariant_check
observability:
  spanName: ent.evalkit
dependencies:
  calls:
  - ent.contracts
  - ent.packaging
  - ent.versioning
  writes: []
