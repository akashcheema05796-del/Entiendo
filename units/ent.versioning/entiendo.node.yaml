# NOTE: entrypoint takes (node, root) — blocked on the single-arg harness seam
apiVersion: entiendo/v1
kind: Node
id: ent.versioning
name: Composite Versioning
task: Compute a unit's composite fingerprint (code+prompt+config+model) with secrets excluded
  and line endings normalised.
description: 'The identity of change: deterministic per-dimension hashing so a unit can be
  pinned, diffed, and reverted alone, and the timeline can scrub through real versions. Secret
  values never enter the hash; CRLF never mints a phantom version.'
nodeKind: compute
group: engine
owner: akashdatageek
status: experimental
claims:
- src/ent/version.py
- src/ent/gitinfo.py
contract:
  invariants: []
  sideEffects: none
evals:
  tier0:
  - type: invariant_check
observability:
  spanName: ent.versioning
dependencies:
  calls:
  - ent.contracts
  writes: []
