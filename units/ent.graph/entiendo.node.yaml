apiVersion: entiendo/v1
kind: Node
id: ent.graph
name: Extractor & Reconciler
task: Generate graph.json and coverage.json from manifests plus source reality; verified declared
  edges or fail the build.
description: Static import analysis per language (Python, TypeScript/JS with tsconfig and
  workspace resolution), edge verification against declarations, ownership and coverage accounting,
  Tarjan cycle detection, dynamic-dep blind-spot flags.
nodeKind: compute
group: engine
owner: akashdatageek
status: experimental
claims:
- src/ent/extractor.py
- src/ent/languages/__init__.py
- src/ent/languages/base.py
- src/ent/languages/python.py
- src/ent/languages/typescript.py
contract:
  entrypoint: src/ent/extractor.py::extract
  invariants:
  - output.ok == True
  sideEffects: none
evals:
  tier0:
  - type: invariant_check
  - type: smoke
    fixture: evals/ent.graph/smoke.jsonl
observability:
  spanName: ent.graph
dependencies:
  calls:
  - ent.contracts
  - ent.evalkit
  - ent.packaging
  - ent.versioning
  writes: []
