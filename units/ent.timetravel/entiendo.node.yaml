apiVersion: entiendo/v1
kind: Node
id: ent.timetravel
name: Replay & Trajectory
task: Attribute score deltas to fingerprint dimensions, judge agent trajectories, and propose
  fixture skeletons from traces.
description: 'The Day-30 payoff: compare an old composite fingerprint to now, re-run or recall
  goldens, and say WHICH dimension moved the metric. Trajectory checks reason over recorded
  tool-call order; fixture proposals mirror retrofit (stage, never overwrite).'
nodeKind: compute
group: runtime
owner: akashdatageek
status: experimental
claims:
- src/ent/replay.py
- src/ent/trajectory.py
- src/ent/fixtures.py
contract:
  invariants:
  - output['ok'] == True
  entrypoint: src/ent/trajectory.py::evaluate
  harness: evals/harness/selfhost.py::evaluate_trajectory
  sideEffects: none
evals:
  tier0:
  - type: invariant_check
  - type: smoke
    fixture: evals/ent.timetravel/smoke.jsonl
observability:
  spanName: ent.timetravel
dependencies:
  calls:
  - ent.contracts
  - ent.evalkit
  - ent.packaging
  - ent.versioning
  writes: []
