apiVersion: entiendo/v1
kind: Node
id: ent.packaging
name: Distribution
task: 'The pip-installable surface: version single-source, extras, entry points, packaged
  schema.'
description: pyproject.toml plus the version-resolution shim. __version__ derives from package
  metadata with a pyproject fallback, so the wheel and the checkout can never drift apart
  again.
nodeKind: config
group: dist
owner: akashdatageek
status: experimental
claims:
- pyproject.toml
- src/ent/__init__.py
contract:
  invariants:
  - output['version'] != '0+unknown'
  entrypoint: src/ent/__init__.py::_resolve_version
  harness: evals/harness/selfhost.py::resolve_version
  sideEffects: none
evals:
  tier0:
  - type: invariant_check
  - type: smoke
    fixture: evals/ent.packaging/smoke.jsonl
observability:
  spanName: ent.packaging
dependencies:
  calls:
  - ent.observer
  writes: []
