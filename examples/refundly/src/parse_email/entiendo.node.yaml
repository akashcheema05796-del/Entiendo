apiVersion: entiendo/v1
kind: Node
id: refundly.parse_email
name: Email Parser
task: Pull the order id and reason out of a customer's refund email.
description: >
  The front door of the refund flow. Reads a support email and extracts the
  order id and a stated reason, so the rest of the pipeline has structured input
  instead of prose. Deterministic string handling — no model, no I/O.
nodeKind: compute
group: refundly
owner: mehar
status: experimental
claims:
  - src/parse_email/parser.py
contract:
  entrypoint: src/parse_email/parser.py::parse
  invariants:
    - "'orderId' in output"
  sideEffects: none
evals:
  tier0:
    - type: invariant_check
    - {type: smoke, fixture: evals/refundly.parse_email/smoke.jsonl}
  tier1:
    # A golden set that spans difficulty (clear cases + two the naive regex gets
    # wrong: an "order number N" phrase and a '#'-prefixed id). Baseline lands at
    # 0.78 — a real discriminating benchmark, not a saturated 1.0. humanBlessed
    # stays false until Mehar reviews and runs `ent bless` (V3).
    - type: golden
      dataset: evals/refundly.parse_email/golden_v3.jsonl
      humanBlessed: false
      metric: exact_match
      baseline: 0.7778
      minRuns: 3
      significance: 0.05
observability:
  spanName: refundly.parse_email
