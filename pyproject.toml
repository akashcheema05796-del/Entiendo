[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entiendo"
version = "0.2.0"
description = "The enforced system map for AI-built software: units with contracts and evals, a reconciler that fails the build on drift (undeclared deps, stale docs, silent model swaps), and a steerable Universe — where the unit, not the file tree, is the unit of work."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Entiendo" }]
keywords = ["instrumentation", "llm", "observability", "evals", "codegen",
            "system-map", "control-plane", "drift-detection", "mcp", "agents"]

# Runtime dependencies. Kept deliberately minimal — the tool must be trivially
# recoverable (SPEC.md §12). Heavier deps (opentelemetry, duckdb) arrive with the
# phases that need them (L2/L3), not at scaffold time.
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
# Phase 2 (L1 extractor / reconciler) — static analysis.
extract = []
# Phase 3 (L2 instrumentation) — OTel span attribution + cost meter.
instrument = [
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
]
# Phase 4 (L3 history) — boring, inspectable storage.
history = [
  "duckdb>=0.9",
  "pyarrow>=14.0",
]
# L5 (interactive edit surface) — the editing model. The HTTP server is stdlib.
serve = [
  "anthropic>=0.40",
]
# `ent mcp` — Entiendo as an MCP server for Claude Code.
mcp = [
  "mcp>=1.0",
]
# `ent detect time` dynamic pass — replay fixtures under shifted clocks.
detect = [
  "time-machine>=2.13",
]
dev = [
  "pytest>=7.0",
  "time-machine>=2.13",
]

[project.scripts]
ent = "ent.cli:main"
# alias matching the PyPI package name, so `uvx entiendo` works (the MCP
# Registry runs pypi packages through uvx, which looks for a script named
# after the package)
entiendo = "ent.cli:main"

[project.urls]
Homepage = "https://entiendo.dev"
Specification = "https://github.com/akashdatageek/entiendo/blob/main/SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ent"]

[tool.hatch.build.targets.wheel.force-include]
"src/ent/universe.html" = "ent/universe.html"
# The manifest schema must ship in the wheel — an installed `ent validate`
# without it is dead on arrival (manifest.schema_path prefers this copy).
"schemas/node.schema.json" = "ent/schemas/node.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
