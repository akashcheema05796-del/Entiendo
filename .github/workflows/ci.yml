name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      # Self-host gate: the repo manages itself with 14 units. Drift between
      # declared edges and real imports fails the build here like anywhere.
      - name: Validate + reconcile the repo's own units
        run: |
          ent validate
          ent extract --check
          ent eval ent.contracts

      - name: Validate + reconcile the example (L0 + L1)
        working-directory: examples/greenfield
        run: |
          ent validate
          ent extract --check

      - name: Eval every example node (tier0 executes the nodes)
        working-directory: examples/greenfield
        run: ent eval --all

      - name: Validate + reconcile refundly (agentic units, trajectory, registry)
        working-directory: examples/refundly
        run: |
          ent validate
          ent extract --check

      - name: Eval refundly (reflex incl. trajectory invariants)
        working-directory: examples/refundly
        run: ent eval --all

      # `ent ci` exits with the MAX severity across its stages (v6 3.2):
      #   0 pass/within-band · 1 RED/REGRESSED · 2 ERROR · 4 UNSTABLE/DEGRADED
      # refundly deliberately ships its gateway OVER its declared cost budget
      # (0.05 spent vs 0.01 declared — the cost-overlay showcase). Budgets now
      # GATE, so the example doubles as the proof: assert the documented
      # DEGRADED exit rather than pretending the overage isn't there.
      - name: ent ci (single gate, severity exit codes)
        working-directory: examples/refundly
        run: |
          set +e; ent ci; code=$?
          test "$code" -eq 4 || { echo "expected exit 4 (seeded budget overage), got $code"; exit 1; }

  # Supply-chain honesty for a trust-first tool: audit the dependency tree and
  # publish a CycloneDX SBOM as a build artifact on every run.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (runtime deps only)
        # setuptools ships preinstalled on the runner and is part of the audited
        # environment — keep it current so the audit reports OUR tree's health,
        # not the runner image's (e.g. PYSEC-2026-3447 in setuptools 79).
        run: |
          pip install --upgrade pip setuptools
          pip install -e . pip-audit cyclonedx-bom
      - name: Audit dependencies
        run: pip-audit
      - name: Generate SBOM (CycloneDX)
        run: cyclonedx-py environment -o sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # v6 4.1 — OPTIONAL browser suite. Gated on a Chromium being present (a
  # pinned /opt/pw-browsers/chromium or a resolvable Playwright install);
  # absent → the step reports the skip and the job stays green. Run locally:
  #   pytest tests/frontend/frontend_universe.py -q
  frontend:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]" playwright
      - name: Frontend suite (if a browser is present)
        run: |
          if [ -x "/opt/pw-browsers/chromium" ] || \
             python -c "from playwright.sync_api import sync_playwright" 2>/dev/null \
             && python - 2>/dev/null <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              p.chromium.launch().close()
          EOF
          then
            pytest tests/frontend/frontend_universe.py -q
          else
            echo "No Chromium available — frontend suite skipped."
          fi
