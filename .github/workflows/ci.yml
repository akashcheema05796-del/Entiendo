name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Validate + reconcile the example (L0 + L1)
        working-directory: examples/greenfield
        run: |
          ent validate
          ent extract --check

      - name: Eval every example node (L2 tier0)
        working-directory: examples/greenfield
        run: |
          for node in retrieval.chunk_ranker retrieval.vector_store state.doc_index llm.gateway config.retrieval; do
            ent eval "$node"
          done
