name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Validate + reconcile the example (L0 + L1)
        working-directory: examples/greenfield
        run: |
          ent validate
          ent extract --check

      - name: Eval every example node (tier0 executes the nodes)
        working-directory: examples/greenfield
        run: ent eval --all

      - name: Validate + reconcile refundly (agentic units, trajectory, registry)
        working-directory: examples/refundly
        run: |
          ent validate
          ent extract --check

      - name: Eval refundly (reflex incl. trajectory invariants)
        working-directory: examples/refundly
        run: ent eval --all

      # `ent ci` exits with the MAX severity across its stages (v6 3.2):
      #   0 pass/within-band · 1 RED/REGRESSED · 2 ERROR · 4 UNSTABLE/DEGRADED
      # The tier1 stage gates on BLESSED goldens only; unblessed datasets are
      # advisory and never block. The example goldens stay unblessed until a
      # human runs `ent bless`, so this is exit 0 today — the wiring is the point.
      - name: ent ci (single gate, severity exit codes)
        working-directory: examples/refundly
        run: ent ci
